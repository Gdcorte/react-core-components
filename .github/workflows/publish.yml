name: Publish Package to npmjs

on:
  push:
    branches:
      - main

# Required for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  tag:
    name: Create new tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Create Tag
        run: |
          tagVersion=v$(cat package.json | jq '.version' -r)
          git config user.name "auto-publisher"
          git tag $tagVersion
          git push --tags
        shell: bash

  build:
    environment: main
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: npm i pnpm --global

      - name: install dependencies
        run: pnpm install

      - name: make build
        run: pnpm build

      - name: Setup .npmrc
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to NPM
        run: npm publish --provenance --access public
        shell: bash
